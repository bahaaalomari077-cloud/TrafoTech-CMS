<div class="contact card-surface">
  <header class="contact-head">
    @if (block().heading) {
      <h2>{{ block().heading }}</h2>
    }
    @if (block().intro) {
      <p class="section-lead">{{ block().intro }}</p>
    }
  </header>

  @if (sent()) {
    <p class="success" role="status">{{ block().successMessage }}</p>
  } @else {
    <form class="contact-form" (submit)="submit($event)">
      <label>
        <span>{{ block().nameLabel }}</span>
        <input type="text" name="name" required [(ngModel)]="name" />
      </label>

      <label>
        <span>{{ block().emailLabel }}</span>
        <input type="email" name="email" required [(ngModel)]="email" />
      </label>

      @if (block().showOrganisation) {
        <label>
          <span>{{ block().organisationLabel }}</span>
          <input type="text" name="organisation" [(ngModel)]="organisation" />
        </label>
      }

      <label>
        <span>{{ block().messageLabel }}</span>
        <textarea name="message" rows="6" required [(ngModel)]="message"></textarea>
      </label>

      <button type="submit" class="btn">
        {{ block().submitButtonText }}
        <span class="arrow" aria-hidden="true">→</span>
      </button>
    </form>
  }
</div>
