@if (loading()) {
  <p class="state">{{ 'common.loading' | t }}</p>
} @else if (error()) {
  <div class="state state-error">
    <p>{{ 'common.error' | t }}</p>
    <button type="button" class="btn" (click)="load()">{{ 'common.retry' | t }}</button>
  </div>
} @else {
  <div class="flip-scene">
  @for (section of page()?.sections?.contentItems || []; track section.contentItemId) {
      <app-section-host [section]="section" />
    }
</div>
}
