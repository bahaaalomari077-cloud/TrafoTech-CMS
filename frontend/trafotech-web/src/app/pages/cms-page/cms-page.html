<section class="section">
  <div class="container">
    @if (loading()) {
      <p class="state">{{ 'common.loading' | t }}</p>
    } @else if (error()) {
      <p class="state state-error">{{ 'common.error' | t }}</p>
    } @else if (!page()) {
      <div class="state">
        <p>{{ 'common.notFound' | t }}</p>
        <a class="btn" routerLink="/">{{ 'common.backHome' | t }}</a>
      </div>
    } @else {
      <article>
        <h1>{{ page()!.displayText }}</h1>

        @if (heroImage(page()); as img) {
          <img [src]="img" [alt]="page()!.displayText" />
        }

        @if (page()!.body?.html; as html) {
          <div class="rich-text" [innerHTML]="html | safeHtml"></div>
        }
      </article>
    }
  </div>
</section>
