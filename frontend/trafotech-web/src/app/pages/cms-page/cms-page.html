@if (loading()) {
  <p class="state">{{ 'common.loading' | t }}</p>
} @else if (error()) {
  <p class="state state-error">{{ 'common.error' | t }}</p>
} @else if (!page()) {
  <div class="state">
    <p>{{ 'common.notFound' | t }}</p>
    <a class="btn" routerLink="/">{{ 'common.backHome' | t }}</a>
  </div>
} @else {
  @for (section of page()!.sections?.contentItems || []; track section.contentItemId) {
    <app-section-host [section]="section" />
  }
}
